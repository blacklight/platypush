include:
  - include/test_procedure.yaml

device_id: platypush-tests
workdir: /tmp/platypush-tests/workdir

main.db:
  engine: sqlite:////tmp/platypush-tests.db

backend.http:
  port: 8123
  num_workers: 1
  use_werkzeug_server: True
  # Don't advertise the test instance over mDNS - it would conflict with any
  # other Platypush instance running on the same host/network.
  zeroconf_enabled: False

redis:
  port: 16379
  socket_timeout: 15
  socket_connect_timeout: 15
